version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: jakone-express-db
    environment:
      POSTGRES_DB: bank_dki_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mounts schema SQL from jakone-db
      - ./jakone-db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d bank_dki_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 2. pgAdmin Management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jakone-db-admin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bankdki.co.id
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app-network

  # 3. Spring Boot Middleware Backend
  backend:
    build:
      context: ./jakone-be
      dockerfile: Dockerfile
    container_name: springboot-backend
    ports:
      - "8080:8080"
    environment:
      # Connects to 'postgres' container using internal Docker DNS
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bank_dki_db
      - SPRING_DATASOURCE_USERNAME=dev_user
      - SPRING_DATASOURCE_PASSWORD=dev_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata: